<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JARVIS Face and Pointing</title>
    <script>
      if (window.location.protocol === "file:") {
        window.location.replace("http://127.0.0.1:8000/demo");
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1015;
        --panel: #131c24;
        --line: #2a3945;
        --text: #edf4f8;
        --muted: #9cafbc;
        --green: #5ee7a6;
        --red: #ff656f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      header {
        height: 64px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      h1 { margin: 0; font-size: 19px; white-space: nowrap; }
      .status { display: flex; gap: 16px; color: var(--muted); font-size: 13px; }
      .status strong { color: var(--text); }
      .spacer { flex: 1; }
      button {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 14px;
        background: #1a2630;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button.stop { border-color: rgba(255,101,111,.5); color: var(--red); }
      button.resume { border-color: rgba(94,231,166,.5); color: var(--green); }
      main { height: calc(100vh - 64px); }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #101820;
      }
      @media (max-width: 760px) {
        header { height: auto; flex-wrap: wrap; padding: 12px; }
        .status { order: 3; width: 100%; flex-wrap: wrap; }
        main { height: calc(100vh - 140px); }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>JARVIS Face &amp; Pointing</h1>
      <div class="status">
        <span>机械臂 <strong id="robot">--</strong></span>
        <span>相机 <strong id="camera">--</strong></span>
        <span>急停 <strong id="safety">--</strong></span>
      </div>
      <div class="spacer"></div>
      <button id="reload">刷新画面</button>
      <button class="stop" id="stop">停止并保持</button>
      <button class="stop" id="estop">急停卸力</button>
      <button class="resume" id="resume" disabled>确认安全并恢复</button>
    </header>
    <main>
      <iframe id="vision" src="http://127.0.0.1:8768/" title="人脸和手指跟踪"></iframe>
    </main>
    <script>
      const visionFrame = document.querySelector("#vision");
      document.querySelector("#reload").addEventListener("click", () => {
        visionFrame.src = visionFrame.src;
      });

      async function refreshStatus() {
        try {
          const response = await fetch("/api/status", { cache: "no-store" });
          const state = await response.json();
          const robot = state.robot || {};
          document.querySelector("#robot").textContent = robot.connected ? "CONNECTED" : "OFFLINE";
          document.querySelector("#camera").textContent = state.camera?.error ? "ERROR" : "READY";
          document.querySelector("#safety").textContent = !robot.stopped
            ? "ENABLED"
            : robot.torque_off ? "TORQUE OFF" : "HOLDING";
          document.querySelector("#resume").disabled = !robot.stopped;
        } catch {
          document.querySelector("#robot").textContent = "SERVICE OFFLINE";
          document.querySelector("#camera").textContent = "--";
          document.querySelector("#safety").textContent = "--";
        }
      }

      // Stop must act on the first click: no confirmation dialog.
      document.querySelector("#stop").addEventListener("click", async () => {
        const response = await fetch("/api/stop", { method: "POST" });
        if (response.ok) refreshStatus();
      });
      document.querySelector("#estop").addEventListener("click", async () => {
        if (!window.confirm("卸力后大臂会下落。确认急停卸力？")) return;
        const response = await fetch("/api/estop", { method: "POST" });
        if (response.ok) refreshStatus();
      });
      document.querySelector("#resume").addEventListener("click", async () => {
        if (!window.confirm("请确认机械臂周围清空、急停可触达。是否恢复？")) return;
        const response = await fetch("/api/resume", { method: "POST" });
        if (response.ok) refreshStatus();
        else alert("恢复失败，请查看服务状态。");
      });

      refreshStatus();
      setInterval(refreshStatus, 2000);
    </script>
  </body>
</html>
